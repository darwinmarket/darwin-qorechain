<text x="948" y="303" fill="#a69f8c" font-size="12">spread 0.30%</text>
<rect x="690" y="380" width="200" height="110" rx="12" fill="#2d2b22" stroke="#474334" stroke-width="1.5"/>
<text x="708" y="410" fill="#f5f2e8" font-size="14.5" font-weight="700">DarwinOracle</text>
<text x="708" y="434" fill="#a69f8c" font-size="12">rounds signed by the</text>
<text x="708" y="453" fill="#a69f8c" font-size="12">reporter (ML-DSA-87)</text>
<text x="708" y="472" fill="#a69f8c" font-size="12">15% breaker, 60 s apart</text>
<rect x="360" y="380" width="250" height="110" rx="12" fill="#2d2b22" stroke="#474334" stroke-width="1.5"/>
<text x="378" y="410" fill="#f5f2e8" font-size="14.5" font-weight="700">pqcVerify / pqcKeyStatus</text>
<text x="378" y="434" fill="#a69f8c" font-size="12">QoreChain precompiles</text>
<text x="378" y="453" fill="#a69f8c" font-size="12">0x...0A01, 0x...0A02</text>
<text x="378" y="472" fill="#a69f8c" font-size="12">used by PqcAuth</text>
<rect x="56" y="380" width="230" height="110" rx="12" fill="#201e17" stroke="#e2c57e" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="74" y="410" fill="#f5f2e8" font-size="14.5" font-weight="700">Reporter, curator, admin</text>
<text x="74" y="434" fill="#a69f8c" font-size="12">ML-DSA-87 keys registered</text>
<text x="74" y="453" fill="#a69f8c" font-size="12">with proof of possession</text>
<text x="74" y="472" fill="#a69f8c" font-size="12">no secp256k1 power</text>
