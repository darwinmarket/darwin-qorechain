<text x="708" y="203" fill="#a69f8c" font-size="12">buys or sells every</text>
<text x="708" y="222" fill="#a69f8c" font-size="12">component, no admin</text>
<rect x="930" y="110" width="180" height="90" rx="12" fill="#2d2b22" stroke="#474334" stroke-width="1.5"/>
