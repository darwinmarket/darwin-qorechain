<text x="74" y="184" fill="#a69f8c" font-size="12">signArbitrary: trade intent</text>
<text x="74" y="203" fill="#a69f8c" font-size="12">secp256k1 + ML-DSA-87</text>
<text x="74" y="222" fill="#a69f8c" font-size="12">+ EVM window, 24 h grant</text>
<rect x="360" y="130" width="250" height="120" rx="12" fill="#2d2b22" stroke="#474334" stroke-width="1.5"/>
<text x="378" y="160" fill="#f5f2e8" font-size="14.5" font-weight="700">Darwin's relayer</text>
