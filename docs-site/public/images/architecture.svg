<rect width="1160" height="560" fill="#201e17"/>
<rect x="22" y="22" width="1116" height="516" fill="none" stroke="#f5f2e8" stroke-opacity="0.10" rx="8"/>
<text x="56" y="64" fill="#f5f2e8" font-size="21" font-weight="600">Darwin on QoreChain</text>
<text x="56" y="88" fill="#a69f8c" font-size="13">Every arrow that changes state carries an ML-DSA-87 signature checked on chain, or against an on-chain key.</text>
<rect x="56" y="130" width="230" height="120" rx="12" fill="#201e17" stroke="#e2c57e" stroke-opacity="0.5" stroke-width="1.5"/>
